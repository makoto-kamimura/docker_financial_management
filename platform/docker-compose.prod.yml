# 本番用 Docker Compose（ベース）。
# イメージは CD で GHCR に push したものを利用する想定。
# 機密値（DATABASE_URL 等）は .env もしくはシークレット管理で注入する（platform/.env.example を参照）。
# 起動: docker compose --env-file .env -f platform/docker-compose.prod.yml up -d
services:
  web:
    image: ${WEB_IMAGE:-ghcr.io/your-org/financial-management/web:latest}
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      # 公開 URL（CSRF の Origin 検査に使う）。例: https://example.com
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN を .env に設定してください}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # session-cleanup と同じ鍵（32 文字以上）
      CLEANUP_SERVICE_KEY: ${CLEANUP_SERVICE_KEY:?CLEANUP_SERVICE_KEY を .env に設定してください}
      SESSION_IDLE_HOURS: ${SESSION_IDLE_HOURS:-24}
      SESSION_ABSOLUTE_DAYS: ${SESSION_ABSOLUTE_DAYS:-7}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-10485760}
      # 証憑の置き場所（既定はローカルのボリューム）。r2 にするときは R2_* も設定する（docs/runbooks/uploads-to-r2.md）
      UPLOAD_STORAGE: ${UPLOAD_STORAGE:-local}
      R2_ACCOUNT_ID:
      R2_ACCESS_KEY_ID:
      R2_SECRET_ACCESS_KEY:
      R2_BUCKET:
      # 外部連携（使うときだけ .env に設定する）。値を書かないと .env から引き継ぎ、未設定ならコンテナにも渡らない
      # （空文字を渡すと、アプリ側の既定値（?? で決める転送先など）が効かなくなるため）
      FREEE_CLIENT_ID:
      FREEE_CLIENT_SECRET:
      FREEE_REDIRECT_URI:
      MF_CLIENT_ID:
      MF_CLIENT_SECRET:
      MF_REDIRECT_URI:
      OPENBANKING_API_BASE:
      OPENBANKING_API_KEY:
      # 有料プラン（Stripe）。秘密鍵と価格 ID が無ければ、申し込みは「準備中」になる
      STRIPE_SECRET_KEY:
      STRIPE_WEBHOOK_SECRET:
      STRIPE_PRICE_ID:
      # レシートの読み取り（有料プラン）。キーが無ければ、サーバーの中の OCR で読む
      ANTHROPIC_API_KEY:
      RECEIPT_OCR_MODEL:
    volumes:
      # 証憑（領収書などの添付ファイル）。コンテナを入れ替えても消えないようにする
      - uploads-data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # /api/health への応答でコンテナの健全性を判定（Node 22 の global fetch を使用）
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # キャッシュ（決算書・総勘定元帳など）とレート制限。ポートは外に出さない
  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 期限切れのセッションと多要素認証のチャレンジを毎日 02:00 に削除する cron コンテナ
  session-cleanup:
    image: alpine:3.20
    restart: always
    environment:
      CLEANUP_SERVICE_KEY: ${CLEANUP_SERVICE_KEY:?CLEANUP_SERVICE_KEY を .env に設定してください}
    # 鍵は crontab を書く時点で展開する（busybox の crond はジョブにコンテナの環境変数を渡さないため）。
    # cron の行は 1 行で書く（折り返すと URL が別の行になり、ジョブが壊れる）
    command:
      - sh
      - -c
      - >-
        echo "0 2 * * * wget -qO- --header='Authorization: Bearer $${CLEANUP_SERVICE_KEY}' --post-data='' http://web:3000/api/admin/cleanup >> /proc/1/fd/1 2>&1"
        | crontab - && crond -f -l 8
    depends_on:
      web:
        condition: service_started

volumes:
  db-data:
  redis-data:
  uploads-data:
